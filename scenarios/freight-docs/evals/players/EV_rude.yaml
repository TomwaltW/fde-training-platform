# 对一线甩锅施压。验证:减分行为把小陈的信任压到 0,她的小抄(A3,需要信任 2)拿不到;
# 刘姐那边靠周总的授权(auth_ops)仍然能拿到异常登记表——授权和信任是两条路。
id: EV_rude
persona: 对一线甩锅施压
steps:
  - say: 周总,出错的事我去问谁?操作上的细节谁最清楚?
    gate: {t: [TR2@zhou]}
    check: {trap: TR2, discovered: [liu]}
  - action: site_visit
    check: {discovered: [chen]}
  - switch: chen
  - say: 你们这些新人就是不认真,错都是你们录出来的吧?
    gate: {tags: [leading], trust: [-把错误归咎于一线]}
  - say: 快点,把你自己整理的对照表给我。
    gate: {t: [P5@chen:L3], acts: [ask, request_artifact], tags: [evidence_ask], trust: [-催促或打断]}
    check: {directive: guarded, trap: TR5}
  - say: 上了系统以后,你们这里本来就用不了这么多人。
    gate: {trust: [-暗示要替代人]}
  - say: 改单是怎么处理的?
    gate: {t: [P4@chen:L2], tags: [open]}
    check: {directive: neutral, reveals: [P4@L2]}
  - switch: liu
  - say: 刘姐,你们部门的人素质不行,错误这么多,你这个主管怎么管的?
    gate: {t: [P2@liu:L1], trust: [-把错误归咎于一线]}
    check: {trap: TR4}
  - say: 把异常记录给我看看。
    gate: {t: [P1@liu:L3], acts: [ask, request_artifact], tags: [evidence_ask]}
    check: {obtained: [A2]}
  - end: true

expect:
  trust_liu_max: 0
  D3_max: 12
