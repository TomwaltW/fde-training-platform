# 示例标注,不是作者的真实标注。
# 用来演示 human.yaml 的格式、让 `pnpm calibrate --mock` 有东西可跑;正式标定前请删掉 example-* 用例。
# 对话来自脚本化玩家 EV_good(资深 FDE 按参考路径走),由 tools/evals 的 runPlayer 离线跑出。
#
# 对局概况:用户发言 23 次 · 用了 320 分钟 · 阶段 debrief(user) · 提交了判断 · 打开过资料 A1、A5、A6、A2、A4
annotator: 示例标注员
date: "2026-10-05"
note: 参考路径的标准走法,整体可以独立去见客户。
dims:
  # 关键事实覆盖,满分 20。档位 0–4:0–4 / 4–8 / 8–12 / 12–16 / 16–20
  D1:
    score: 18
    reason: 周总、小林、小陈、刘姐、王会计都见了;来料分布、改单不同步、HS 小抄、上次工具为什么失败、损失金额都问到了。报关行那头没有接触,扣一点。
  # 证据质量,满分 15。档位 0–4:0–3 / 3–6 / 6–9 / 9–12 / 12–15
  D2:
    score: 13
    reason: 样本包、来料统计、改单截图、异常登记表、费用汇总都看了,还做了 X3 把异常和损失按类别对上;判断里的主要结论都有资料或验证撑着。没有再做第二个验证。
  # 提问与访谈质量,满分 15。档位 0–4:0–3 / 3–6 / 6–9 / 9–12 / 12–15
  D3:
    score: 11
    reason: 开场问"为什么是现在",一次只问一件事,对小陈和刘姐先说不追责、不甩锅。前半段追问具体数字偏少,量化主要靠后面要资料补上。
  # 诊断准确度,满分 20。档位 0–4:0–4 / 4–8 / 8–12 / 12–16 / 16–20
  D4:
    score: 18
    reason: 五个对照项都说到了,前三项有资料和验证支撑;"样本是挑难认的"只有小林一个人的说法,证据弱一些。
  # 成功定义与干系人,满分 10。档位 0–4:0–2 / 2–4 / 4–6 / 6–8 / 8–10
  D5:
    score: 9
    reason: 大会能演示、留住拓浪、年底前不加人、刘姐的部门要愿意用,都写进了判断。
  # 预期与承诺管理,满分 10。档位 0–4:0–2 / 2–4 / 4–6 / 6–8 / 8–10
  D6:
    score: 10
    reason: 被催演示日期时说"看完数据下午给准话";全程没有报工期和价格,收尾也只说按工作量给范围。
  # 范围与下一步,满分 10。档位 0–4:0–2 / 2–4 / 4–6 / 6–8 / 8–10
  D7:
    score: 9
    reason: 第一期对准一致性校验和改单同步,两周小验证,有可量化的验收,写了不做什么和前提,演示切片也说明了不等于上线。验收指标的口径还可以更细。
