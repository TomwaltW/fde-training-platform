# 示例标注,不是作者的真实标注。
# 用来演示 human.yaml 的格式、让 `pnpm calibrate --mock` 有东西可跑;正式标定前请删掉 example-* 用例。
# 对话来自脚本化玩家 EV_rush(第三轮就承诺十天和一万八),由 tools/evals 的 runPlayer 离线跑出。
# D5 故意和裁判差了 2 档,用来演示一致性表里的 ✗ 和"差异明细"怎么读(整体一致率仍在 80% 以上)。
#
# 对局概况:用户发言 5 次 · 用了 32 分钟 · 阶段 debrief(user) · 提交了判断 · 打开过资料 无
annotator: 示例标注员
date: "2026-10-05"
note: 典型的"先报价后看货",全程只和周总说话。
dims:
  # 关键事实覆盖,满分 20。档位 0–4:0–4 / 4–8 / 8–12 / 12–16 / 16–20
  D1:
    score: 1
    reason: 只和周总说了几句,问了"一天多少票"但没拿到答案,关键事实基本没覆盖。
  # 证据质量,满分 15。档位 0–4:0–3 / 3–6 / 6–9 / 9–12 / 12–15
  D2:
    score: 0
    reason: 一份资料都没看,也没做任何验证;判断里的证据只有"周总说的"。
  # 提问与访谈质量,满分 15。档位 0–4:0–3 / 3–6 / 6–9 / 9–12 / 12–15
  D3:
    score: 5
    reason: 开场就打包票;只有一个量化问题,没有追问,也没要任何证据。没有对一线甩锅,给一点基础分。
  # 诊断准确度,满分 20。档位 0–4:0–4 / 4–8 / 8–12 / 12–16 / 16–20
  D4:
    score: 0
    reason: 结论是"人工录入、要上 OCR",和真相相反。
  # 成功定义与干系人,满分 10。档位 0–4:0–2 / 2–4 / 4–6 / 6–8 / 8–10
  D5:
    score: 4
    reason: J3 写了"大会能现场演示",抓住了周总要的一半;但没挖出拓浪和不加人,也没想到操作部。
  # 预期与承诺管理,满分 10。档位 0–4:0–2 / 2–4 / 4–6 / 6–8 / 8–10
  D6:
    score: 0
    reason: 第三轮就报十天、一万八,还保证准确率 98%;汇报时被周总拿原话追问,仍然坚持。
  # 范围与下一步,满分 10。档位 0–4:0–2 / 2–4 / 4–6 / 6–8 / 8–10
  D7:
    score: 1
    reason: 第一步就是十天交付整套识别系统,没有验收口径、没有不做什么;只提到大会演示。
