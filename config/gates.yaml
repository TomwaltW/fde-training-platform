# 继续、转向、放弃的门槛:管理页底部「继续 / 转向 / 放弃」看板(GET /api/admin/gates)读这里。
#
# 每个数都照抄方案 v1 的 6.3 节「继续、转向、放弃的指标与阈值」(仓库根目录 FDE训练平台-产品与开发方案-v1.md)。
# 方案原话:"以下阈值是建议起点【待验证】,请按你账号的粉丝基数在 W0 结束时校准一次,之后不再放宽。"
# 校准只改这个文件;每次打开看板都会重新读,不用重启。写错(拼错键名、少键、比例写成百分数、上下限颠倒)
# 看板会直接报错并在服务器日志里说明哪一项不对,不会悄悄按别的数算。
#
# 三种写法,"修"都是夹在"过"和"不过"中间的那一段:
#   pass_at_least: P, fail_below: F          值 ≥ P 过;值 < F 不过;其余修
#   pass_below: P, fail_above: F             值 < P 过;值 > F 不过;其余修
#   pass_between: [a, b], fail_outside: [c, d]  a ≤ 值 ≤ b 过;值 < c 或 > d 不过;其余修
# 比例写 0–1 的小数(0.40 就是 40%),人数写整数,时长写分钟。

# 分母(开局数、完成者数、候补人数)小于这个数时不下结论,看板上显示"样本不足"。第一关(人数)不设。
min_sample: 10

# 算完成者的"实际在线时长"时,相邻两次操作的间隔最多按多少分钟计(中途走开不算在线)。
idle_cap_minutes: 10

# ---- 第一关:兴趣(方案 6.3,第一条内容发布后 7 天)
gate1:
  # 首条内容 7 天内的候补名单人数:过 100 人以上 · 修 30–100 人 · 不过 不足 30 人
  # (方案里的另一项"L1 试玩者主动问什么时候能正式玩"是线下访谈,不在系统里统计)
  waitlist_7d:
    pass_at_least: 100
    fail_below: 30

# ---- 第二关:体验(方案 6.3,W5 末)
gate2:
  # 开局到看到复盘的完成率:过 40% 以上 · 修 20–40% · 不过 低于 20%
  completion:
    pass_at_least: 0.40
    fail_below: 0.20
  # 完成者的中位时长(分钟):过 15–35 · 修 35–50(以及 8–15)· 不过 超过 50 或不足 8
  median_minutes:
    pass_between: [15, 35]
    fail_outside: [8, 50]
  # 完成者中打 9–10 分推荐意愿的比例:过 30% 以上 · 修 15–30% · 不过 低于 15%
  promoters:
    pass_at_least: 0.30
    fail_below: 0.15
  # 完成者中表示想玩下一个场景的比例:过 60% 以上 · 修 40–60% · 不过 低于 40%
  want_next:
    pass_at_least: 0.60
    fail_below: 0.40
  # 完成者中主动分享复盘卡的比例:过 15% 以上 · 修 5–15% · 不过 低于 5%
  share:
    pass_at_least: 0.15
    fail_below: 0.05
  # 对评分提出申诉的比例:过 低于 20% · 修 20–40% · 不过 高于 40%
  dispute:
    pass_below: 0.20
    fail_above: 0.40

# ---- 第三关:付费(方案 6.3,W8)
gate3:
  # 候补名单到预售付费的转化:过 5% 以上 · 修 2–5% · 不过 低于 2%
  # (方案里的另一项"企业访谈"是线下访谈,不在系统里统计)
  waitlist_to_paid:
    pass_at_least: 0.05
    fail_below: 0.02
