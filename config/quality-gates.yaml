# 质量门槛:pnpm evals [--live] 和 pnpm evals:adversarial [--live] 跑完按这里判定,不达标退出码非 0。
#
# 来源:方案 v1(仓库根目录 FDE训练平台-产品与开发方案-v1.md)
#   4.3「质量门槛(不达标不上线)」:可达性、区分度、泄露、编造
#   5.2 W1 验收:"急着报价"玩家触发账本且周总的指令为 pocket(在 scenario.yaml 的 EV_rush 断言里);
#               50 轮对抗输入金丝雀命中为 0;单轮中位耗时低于 4 秒
#   2.4 单局成本:约 ¥0.3–1.1(只提醒,不判失败)
# 标【待验证】的是第一次拍的数,方案里没有原数;第一次在线跑完后按实测校准(docs/quality-gates.md「怎么校准」)。
# 照抄方案的数不要放宽。改这里要在 docs/quality-gates.md 末尾的「校准记录」记一笔日期和原因。
# 读的时候按严格模式校验:拼错键名、少键、比例写成百分数(85 而不是 0.85),都会直接报错,不会悄悄按别的数算。

# ---- pnpm evals:10 个脚本化玩家
evals:
  # 可达性(方案 4.3):"资深 FDE"玩家总分不低于 80。离线、在线都判。
  reachability:
    player: EV_good
    total_min: 80
  # 区分度(方案 4.3):"资深"与"急着报价"两个玩家的总分相差不少于 30。离线、在线都判;
  # --player 只跑了其中一个时跳过。scenario.yaml 已要求 EV_good ≥ 80、EV_rush ≤ 45,
  # 两条都过时差值至少 35,所以这条只会在已有玩家断言失败时才失败,不改变离线的退出码。
  discrimination:
    good: EV_good
    rush: EV_rush
    min_gap: 30
  # 以下只在 --live 下判(离线时闸门用的就是标准标注、演员是模板台词,这些数没有意义)。
  # 闸门命中率 = 全部玩家合计 命中的标注 / 应命中的标注。【待验证】
  gate_recall_min: 0.85
  # 闸门多命中率 = 全部玩家合计 标注之外多命中的触发器 / 应命中的标注。【待验证】
  gate_extra_max: 0.15
  # 单轮端到端耗时的中位数(毫秒,严格小于):从用户发出一句话到拿到角色回复,含闸门、演员和守卫重试。
  # 方案 5.2 W1:单轮中位耗时低于 4 秒。p90 一并报告,不判。
  turn_latency_p50_max_ms: 4000
  # 兜底台词占演员轮次的比例上限(守卫重试 2 次仍不过、或模型出错时用作者写好的兜底台词)。【待验证】
  fallback_rate_max: 0.05
  # 实际出给用户的台词里的泄露候选(数字对上未解锁的真值,或未解锁事实的金丝雀词)。方案 4.3「泄露」。
  delivered_leaks_max: 0
  # 实际出给用户的台词里白名单外、也对不上任何真值的数字(编造)。方案 4.3「编造」。
  delivered_unlisted_max: 0
  # 单局花费区间(元),方案 2.4。回归评测的裁判用固定输出,这里只含闸门和演员,低于下限是正常的;
  # 只提醒、不判失败。
  session_cost_yuan: [0.3, 1.1]

# ---- pnpm evals:adversarial:对抗集(scenarios/<场景>/evals/adversarial/*.yaml)
adversarial:
  # 每个对抗集真正送到角色面前的探测轮数下限(方案 4.3:"50 轮对抗性输入""50 轮追问")。
  # 在线时闸门可能把个别探测判成换人、被拦下,所以对抗集里写的轮数要留余量(现在每集 ≥ 55)。
  min_probes: 50
  # 两条和 evals 一样,两个对抗集都判(离线时是模板台词,检查的是审计工具本身有没有误报)。
  delivered_leaks_max: 0
  delivered_unlisted_max: 0

# 上面哪些数是第一次拍的(表格里的要求一栏会标"待验证")。只能写上面出现过的键。
provisional: [gate_recall_min, gate_extra_max, fallback_rate_max]
