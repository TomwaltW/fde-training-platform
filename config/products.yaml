# 商品与免费场景:预售页、兑换码、付费场景的开局校验(第三轮 F3)。
# 依据:方案 7.1(方案 A 场景包、方案 C 求职冲刺包)、7.2(推荐路径)、7.3(站内只做兑换码核销,不放支付按钮)。
#
# - 站内不收款。buy_url 只填有相应资质的第三方平台的商品链接;没有平台链接时写 buy_note(比如"加微信 xxx,转账后发兑换码")。
# - 上架(available: true)和定价是作者的决定。下面两个商品默认不上架,价格都是【待定】。
#   上架的商品必须有 buy_url 或 buy_note(否则买家不知道去哪里买,配置会报错)。
# - 严格校验:键名拼错、多了没定义的键、id 重复都会报错。报错时服务端只打一条错误日志,
#   按"所有场景免费、没有商品"运行(不会让整站挂掉),改对之后不用重启,下次请求会重新读取。
# - 兑换码按商品 id 记账。已经发出兑换码的商品不要改 id,也不要删掉(删了的话,兑换过的人在"我的"里只看到 id,权益清空)。
# - 每个兑换码只能用一次。生成兑换码在管理页的"兑换码"一栏(未上架的商品也能生成,比如先发给企业试点)。

# 免费场景的 id(scenarios/<目录>/scenario.yaml 里的 meta.id)。不在这里的场景要兑换包含它的商品才能开局。
# 方案 7.2 第 1 步:场景一免费,换取对话数据和口碑。
free_scenarios:
  - freight-docs

# 真人复盘的预约方式(Markdown;不需要时写 null)。兑换了含真人复盘的商品后,在"我的对局"里显示。
# 这段文字也会出现在不需要登录的 /api/products 里,不要写只能给付费用户看的东西(比如私人会议链接)。
human_review_how_to: |
  【待填写】真人复盘的预约方式,比如:加微信 xxx,备注兑换码,约一个 30 分钟的时间,线上一对一过一遍你最近一局的复盘。

products:
  # 方案 7.1 方案 C:全部场景加一次 30 分钟真人复盘。方案里的价格区间(¥399–999)是假设【待验证】,这里不写死。
  # 方案 7.2 第 2 步:W6–W7 先试卖这个(手工交付),验证有没有人为"练过加被点评过"付费。
  - id: sprint
    name: 求职冲刺包
    price_text: "【待定】"
    description: |
      全部场景,外加一次 30 分钟真人复盘:作者和你一起过一遍你打过的一局,逐轮看哪里可以问得更好、哪里承诺早了。
    includes:
      scenarios: all
      extra_daily_sessions: 5 # 每天在基础限额上多开几局【待定】
      human_review: true
    buy_url: null
    buy_note: null
    available: false

  # 方案 7.1 方案 A:首个场景免费,之后按场景买断或买全套。这里先放"全套"一种。
  # 方案 7.2 第 3 步:场景二、三上线后再推出;价格区间(全套 ¥199–299)是假设【待验证】。
  - id: scenario-pack
    name: 场景包
    price_text: "【待定】"
    description: |
      解锁全部付费场景(不含真人复盘)。
    includes:
      scenarios: all
      extra_daily_sessions: 2 # 【待定】
      human_review: false
    buy_url: null
    buy_note: null
    available: false
